backend:
  name: git-gateway
  branch: main

# আপলোড করা ছবি সংরক্ষণের জায়গা
media_folder: "images/uploads"
public_folder: "/images/uploads"

# খবর ও পোস্ট ড্যাশবোর্ড সেটিংস
collections:
  - name: "news"
    label: "News & Posts"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { 
          label: "Category", 
          name: "category", 
          widget: "select", 
          options: ["Market News", "Security Tips", "Airdrop Info", "Crypto Basics"] 
        }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
